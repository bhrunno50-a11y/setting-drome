name: 📡 Mutiny TV IPTV Pirate Engine v722 - SRT Sync Core Fixed

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada Continua con Marquesina Alterna (v726)
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v726 - ALTERNATING MARQUEE CORE]
          export TERM=xterm
          
          echo "Conectando al Satélite..." > letrero.txt
          echo "Cargando marquesina..." > abajo.txt
          
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/noticias.txt"
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/playlist.txt"
          
          # 1. SUCCIONAMOS LAS DOS PRIMERAS LÍNEAS DEL GIST DE NOTICIAS
          NOTICIA_RAW=$(curl -s "$URL_GIST_NOTICIAS" | tr -d '\r')
          LINEA_1=$(echo "$NOTICIA_RAW" | sed -n '1p' | sed 's/^[ \t]*//;s/[ \t]*$//')
          LINEA_2=$(echo "$NOTICIA_RAW" | sed -n '2p' | sed 's/^[ \t]*//;s/[ \t]*$//')
          
          # Si el Gist no tiene un segundo renglón, le ponemos un texto genérico de la comunidad
          if [ -z "$LINEA_2" ]; then
            LINEA_2="streamdrome.surge.sh - tiktok@streamdrome.surge.sh"
          fi
          
          echo "📡 [MUTINY TV] SUCCIONANDO GRILLA PARA DESCARGA LOCAL..."
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_cruda.txt
          
          # =========================================================================
          # 🔥 EL OSCILADOR DE TEXTO (Sincronizador en segundo plano)
          # Este bucle cambia el texto de abajo.txt entre la Línea 1 y la Línea 2 cada 25 segundos
          # =========================================================================
          (
            while true; do
              echo "$LINEA_1" > abajo.txt
              sleep 25
              echo "$LINEA_2" > abajo.txt
              sleep 25
            done
          ) &
          PID_OSCILADOR=$!
          
            # =========================================================================
          # 🌪️ CREACIÓN DE LA TUBERÍA INTERNA UNIFICADA (Anti-Baches de Kick)
          # =========================================================================
          rm -f puente_stream
          mkfifo puente_stream

          # 🔥 EL EMISOR FIJO MAESTRO (Un solo proceso absoluto hacia Kick)
          # Procesa la marquesina en movimiento de forma ultra fluida a 30 FPS constantes.
          ffmpeg -y -re -i puente_stream \
            -filter_complex "color=c=black:s=1280x720:d=999999[fondo_base]; [0:v]scale=1280:720,crop=1270:710:5:5,hue=s=0.95,rotate=0.01:fillcolor=black[peli_expandida]; [fondo_base][peli_expandida]overlay=0:0[canvas_parcial]; [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,drawtext=textfile=abajo.txt:reload=1:x=1280-mod(t*130\,1280+tw):y=665:fontsize=24:fontcolor=0xFFFFFF:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -map "[canvas_fusionado]" -map 0:a:0? \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -af "pan=stereo|c0=0.95*c0+0.05*c1|c1=0.05*c0+0.95*c1,aresample=async=1" \
            -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin \
            -flvflags no_duration_filesize \
            -f mpegts "${{ secrets.KICK_RTMP_URL }}" &
          
          PID_MAESTRO=$!
          contador=1
          
          while read -r linea || [ -n "$linea" ]; do
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            TITULO_PELI=$(echo "$linea" | awk -F'|' '{print $2}' | sed 's/^[ \t]*//;s/[ \t]*$//')
            
            if [ -z "$TITULO_PELI" ]; then
              TITULO_PELI="Terravision - El Codigo del Billon de Dolares"
            fi
            
            if [ -n "$URL_INTERNET" ]; then
              FILE_READY="ready_part_${contador}.mp4"
              
              echo "📥 [TRAMO $contador] Succionando desde GitHub Releases: $TITULO_PELI"
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" </dev/null \
                       -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                       -o "$FILE_READY" "$URL_INTERNET"
              
              # Actualizamos los letreros informativos antes de mandar el video al aire
              echo "Ahora en Vivo: $TITULO_PELI" > letrero.txt
              
              echo "🚀 Inyectando $TITULO_PELI al canal de transmisión..."
              # Empujamos el video de forma secuencial sin recodificar (-c copy no consume CPU)
              ffmpeg -i "$FILE_READY" -c copy -f mpegts -fflags +genpts puente_stream
              
              rm -f "$FILE_READY"
              contador=$((contador + 1))
            fi
          done < grilla_cruda.txt

          echo "🏁 Maratón completada. Bajando palanca de los motores..."
          kill $PID_OSCILADOR 2>/dev/null || true
          kill $PID_MAESTRO 2>/dev/null || true
          rm -f puente_stream
          echo "🏁 Satélite apagado de forma limpia."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
