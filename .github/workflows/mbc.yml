name: 📡 Mutiny TV IPTV Pirate Engine v715 - SRT Sync Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada hacia Kick vía SRT Síncrona Inmune
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v715 - BYPASS TOTAL SIN PRE-DESCARGAS]
          export TERM=xterm
          
          echo "Cargando..." > letrero.txt
          echo "🍿 Mutiny TV - Transmisión Soberana en Vivo" > abajo.txt
          
          # Tus rutas del nuevo Gist independiente de transmisión
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/noticias.txt"
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/playlist.txt"
          
          curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt
          echo "📡 [MUTINY TV] SUCCIONANDO GRILLA DE ENLACES..."
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_cruda.txt
          
          # Fabricamos el archivo de playlist dinámico para el formato CONCAT de FFmpeg
          echo "# Lista de flujos de red para concat" > playlist_local.txt
          
          while read -r linea || [ -n "$linea" ]; do
            # Separamos la URL limpia (el primer caño antes del '|')
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | sed 's/^[ \t]*//;s/[ \t]*$//')
            
            if [ -n "$URL_INTERNET" ]; then
              # Inyectamos la URL de internet directo en la lista de reproducción de FFmpeg
              echo "file '$URL_INTERNET'" >> playlist_local.txt
            fi
          done < grilla_cruda.txt
          
          echo "🪓 [MUTINY] DETECTANDO PRIMER TÍTULO DE MARATÓN..."
          PRIMERA_LINEA=$(head -n 1 grilla_cruda.txt)
          TITULO_INICIAL=$(echo "$PRIMERA_LINEA" | awk -F'|' '{print $2}' | sed 's/^[ \t]*//;s/[ \t]*$//')
          
          echo "${TITULO_INICIAL:-sigueme en tiktok @streamdrome}" > letrero.txt
          echo "🪓 [MUTINY] COMPROBANDO LA CAÑERÍA DE REPRODUCCIÓN EN DIRECTO:"
          cat playlist_local.txt
          
          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN SRT DIRECTO A KICK..."
          
          # 🧠 [REREACTOR DE AUDIO v3.1 - FILTRO DE INMUNIDAD ACÚSTICA ULTRA-LIMPIA]
          # Metemos las banderas de reconexión directo al concat para digerir los micro-cortes del IPTV en vivo.
          ffmpeg -y \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
            -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin -re -async 1 \
            -f concat -safe 0 \
            -i playlist_local.txt \
            -re -loop 1 -i plantilla_horizontal.png \
            -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,hue=s=0.95,rotate=0.01:fillcolor=black[peli_expandida]; [1:v]scale=1280:720[fondo_base]; [fondo_base][peli_expandida]overlay=0:0:shortest=1[canvas_parcial]; [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -map 0:a:0? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -af "pan=stereo|c0=0.95*c0+0.05*c1|c1=0.05*c0+0.95*c1,aresample=async=1" \
            -f mpegts 'srt://fa723fc1b171.srt.live-video.net:9000?streamid=sk_us-west-2_MqGIuZCjdkwn_W8taony5k1gvPaCz1F7MWd2Rd0QAvb&passphrase=vrdzu5pih7bmRaVralELJ2wlBzrQPgsp08kGoZmPTKkqlkbN8CPzuUEYUtJU5ivRJE6nBqIOGPr2V1Q' || true
            
          echo "🏁 La maratón ha finalizado de largo fluido. Satélite apagado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
