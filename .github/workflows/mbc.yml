name: 📡 Mutiny TV IPTV Pirate Engine v716 - SRT Dynamic Sync Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada hacia Kick vía SRT Síncrona Inmune
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v716 - DIEGO DYNAMIC SRT CORE]
          export TERM=xterm
          
          echo "🍿 Mutiny TV - Transmisión Soberana en Vivo" > abajo.txt
          
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/noticias.txt"
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/bhrunno50-a11y/5abfba18c2334105829d1badfff0c09b/raw/playlist.txt"
         
          echo "📡 [MUTINY TV] SUCCIONANDO GRILLA PARA DESCARGA LOCAL..."
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_cruda.txt
          
          # [SOLUCIÓN CONTROL DE DAÑOS]: Sanitización de textos de noticias para marquesina inferior
          curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo_crudo.txt
          cat abajo_crudo.txt | sed "s/'//g" | sed 's/!//g' > abajo.txt

          # Preparación del archivo de concatenación local y base de tiempo para subtítulos dinámicos
          echo "# Lista de videos locales para concat" > playlist_local.txt
          echo "" > maraton_titulos.srt
          
          contador=1
          tiempo_acumulado=0
          
          # Descarga veloz a la máquina virtual y cálculo de tiempos para títulos dinámicos
          while read -r linea || [ -n "$linea" ]; do
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            TITULO_VIDEO=$(echo "$linea" | awk -F'|' '{print $2}' | sed "s/'//g; s/!//g" | sed 's/^[ \t]*//;s/[ \t]*$//')
            
            if [ -z "$TITULO_VIDEO" ]; then
              TITULO_VIDEO="Sigueme en TikTok @streamdrome"
            fi
            
            if [ -n "$URL_INTERNET" ]; then
              echo "📥 Pre-descargando Tramo $contador de internet: $URL_INTERNET"
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "local_part_${contador}.mp4" "$URL_INTERNET"
              
              echo "file 'local_part_${contador}.mp4'" >> playlist_local.txt
              
              # 🧠 ARQUITECTURA DE TIEMPO REAL: Extraemos la duración exacta del video bajado usando ffprobe
              duracion=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:key=value "local_part_${contador}.mp4" | awk '{print int($1)}')
              if [ -z "$duracion" ] || [ "$duracion" -le 0 ]; then
                duracion=1200 # En caso de error de lectura le asigna 20 minutos base por seguridad
              fi
              
              # Calculamos fin del tramo
              tiempo_fin=$((tiempo_acumulado + duracion))
              
              # Convertimos segundos en formato SRT estándar (HH:MM:SS,000)
              inicio_srt=$(date -u -d "@$tiempo_acumulado" +"%H:%M:%S,000")
              fin_srt=$(date -u -d "@$tiempo_fin" +"%H:%M:%S,000")
              
              # Inyectamos el bloque de subtítulo correspondiente a este video específico
              echo "$contador" >> maraton_titulos.srt
              echo "$inicio_srt --> $fin_srt" >> maraton_titulos.srt
              echo "$TITULO_VIDEO" >> maraton_titulos.srt
              echo "" >> maraton_titulos.srt
              
              # Desplazamos el puntero del reloj acumulado para el próximo video
              tiempo_acumulado=$tiempo_fin
              contador=$((contador + 1))
            fi
          done < grilla_cruda.txt
          
          echo "🪓 [MUTINY] COMPROBANDO LA CAÑERÍA LOCAL RE-DIRECCIONADA:"
          cat playlist_local.txt
          echo "🪓 [MUTINY] MAPA DE SUBTÍTULOS DINÁMICOS GENERADO:"
          cat maraton_titulos.srt
          
          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN SRT DE TRACCIÓN LIVIANA..."
          
          # Generación automática de un fondo oscuro si no existe la plantilla horizontal
          if [ ! -f plantilla_horizontal.png ]; then
            ffmpeg -f lavfi -i color=c=black:s=1280x720:d=1 -vframes 1 plantilla_horizontal.png
          fi

          # 🧠 [REREACTOR DE VIDEO & AUDIO v716 - CORRECCIÓN MARQUESINA MÓVIL Y LETRERO DINÁMICO]
          ffmpeg -y \
          -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin \
          -re -async 1 -vsync cfr \
          -f concat -safe 0 \
          -i playlist_local.txt \
          -re -loop 1 -i plantilla_horizontal.png \
          -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,hue=s=0.95,rotate=0.01:fillcolor=black[peli_expandida]; [1:v]scale=1280:720[fondo_base]; [fondo_base][peli_expandida]overlay=0:0:shortest=1[canvas_parcial]; [canvas_parcial]subtitles=maraton_titulos.srt:force_style='Fontname=DejaVu Sans,Fontsize=18,PrimaryColour=&H00E676&,BorderStyle=3,Outline=2,OutlineColour=&H000000&,Alignment=5,MarginL=30,MarginV=660'[canvas_subtitulado]; [canvas_subtitulado]drawtext=textfile=abajo.txt:reload=1:x=w-mod(t*120\,w+tw):y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
          -r 30 -g 60 -keyint_min 60 -map 0:a:0? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 5000k -maxrate 5000k -bufsize 8000k \
          -c:a aac -b:a 128k -ac 2 -ar 44100 -af "pan=stereo|c0=0.95*c0+0.05*c1|c1=0.05*c0+0.95*c1,aresample=async=1" \
          -f mpegts "${{ secrets.KICK_SRT_URL }}" || true

          echo "🏁 La maratón ha finalizado de largo fluido. Satélite apagado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
